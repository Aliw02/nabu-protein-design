[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nabu-protein"
version = "0.4.0"
description = "NABU: Ultra-fast combinatorial protein fitness prediction and directed evolution architecture"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary / All Rights Reserved" }
authors = [
    { name = "NABU Inventor & Contributors" }
]
keywords = [
    "protein-design",
    "computational-biology",
    "directed-evolution",
    "epistasis",
    "bioinformatics"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]

[project.scripts]
nabu-protein = "nabu_protein.cli:main"
nabu-v83-benchmark = "nabu_protein.v83_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
