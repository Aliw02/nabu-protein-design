name: NABU V9 Contextual ESM Candidate

on:
  push:
    branches:
      - exp/nabu-v9-pair-transfer-dev
    paths:
      - "experiments/v9_pair_transfer_dev/V9_CONTEXTUAL_PROTOCOL.md"
      - "experiments/v9_pair_transfer_dev/run_v9_contextual.py"
      - "experiments/v9_pair_transfer_dev/tests/test_v9_contextual.py"
      - ".github/workflows/nabu-v9-contextual.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v9-contextual:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_DISABLE_TELEMETRY: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install NABU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-hardening.txt
          python -m pip install -r phase2/2D_untouched_transfer/requirements-phase2d.txt
          python -m pip install -e . --no-deps

      - name: Install frozen contextual encoder stack
        run: |
          python -m pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==5.17.0 safetensors

      - name: Run V9 contextual contracts
        run: |
          python -m pytest -q             experiments/v9_pair_transfer_dev/tests/test_v9_contextual.py             experiments/v9_pair_transfer_dev/tests/test_v9_candidate.py             experiments/v9_pair_transfer_dev/clean_pair_poc/tests/test_clean_pair_poc.py             experiments/v9_pair_transfer_dev/clean_pair_poc/tests/test_clean_pair_calibration.py             tests/test_v83_contracts.py             tests/test_frozen_v83_parity.py

      - name: Download pinned IRED source
        run: |
          mkdir -p .v9_source
          python - <<'PY'
          from pathlib import Path
          from urllib.request import urlretrieve

          url = "https://flip.protein.properties/assets/splits/ired/two_to_many.csv.gz"
          path = Path(".v9_source/ired_two_to_many.csv.gz")
          urlretrieve(url, path)
          print(path)
          PY
          echo "aa45a2f85fb1af87b6b0e86397b3f8f292a061dc574be2536673b5bd490b0e74  .v9_source/ired_two_to_many.csv.gz" | sha256sum -c -

      - name: Run V9 contextual higher-order comparison
        run: |
          python experiments/v9_pair_transfer_dev/run_v9_contextual.py             .v9_source/ired_two_to_many.csv.gz             --out v9_contextual_results             --batch-size 16

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: nabu-v9-contextual-esm-candidate
          path: v9_contextual_results/
          if-no-files-found: error
