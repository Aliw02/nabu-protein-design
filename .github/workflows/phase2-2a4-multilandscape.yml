name: NABU Phase 2A4 Multilandscape

on:
  pull_request:
    branches:
      - engineering/v8-3-package-hardening
    paths:
      - "phase2/2A_closed_loop_acquisition/**"
      - ".github/workflows/phase2-2a4-multilandscape.yml"
      - "experiments/v8_3_multilandscape_validation/prepare_four_site.py"
      - "src/nabu_protein/**"
      - "requirements-hardening.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-2a4:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned hardening environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-hardening.txt
          python -m pip install -e . --no-deps

      - name: Run Phase 2A tests through 2A4
        run: |
          python -m pytest -q             phase2/2A_closed_loop_acquisition/2A0_campaign_simulator/tests             phase2/2A_closed_loop_acquisition/2A1_baselines/tests             phase2/2A_closed_loop_acquisition/2A2_micro_batch_loop/tests             phase2/2A_closed_loop_acquisition/2A3_adaptive_controller/tests             phase2/2A_closed_loop_acquisition/2A4_multilandscape_evaluation/tests

      - name: Download pinned multilandscape sources
        run: |
          mkdir -p .phase2a4_data .ci_artifacts/phase2_2a4_multilandscape

          curl -L --fail             "https://raw.githubusercontent.com/rcronk/mutate/0861a3f1f6c58a9597fde689eb7f9a07b38e2638/ridge/data/gb1_wu2016_landscape.csv"             -o .phase2a4_data/gb1_raw.csv

          curl -L --fail             "https://raw.githubusercontent.com/rcronk/mutate/0861a3f1f6c58a9597fde689eb7f9a07b38e2638/ridge/data/johnston2024_trpb_landscape.csv"             -o .phase2a4_data/trpb_raw.csv

          curl -L --fail             "https://raw.githubusercontent.com/hury07/fasthit/0f9c51aa7caaab0b4618b0cab4f3107e7251091b/fasthit/landscapes/data/phoq/PhoQ.csv"             -o .phase2a4_data/phoq_raw.csv

      - name: Verify source hashes
        run: |
          echo "02ef9bc1784a67ee14cf4024596a8fcfc7129779911c6589ed896373552125b1  .phase2a4_data/gb1_raw.csv" | sha256sum -c -
          echo "208d7ba38c3c7b12009cc3c34be1d9b95deb0009b50ede89a0a8ef3347c62f19  .phase2a4_data/trpb_raw.csv" | sha256sum -c -
          echo "18e6d4ecc271d0106521a2205d4d80a8f7531e70c4fd5e01e82d12d9eeff8ff9  .phase2a4_data/phoq_raw.csv" | sha256sum -c -

      - name: Adapt four-site landscapes
        run: |
          python experiments/v8_3_multilandscape_validation/prepare_four_site.py             .phase2a4_data/gb1_raw.csv             --variant-column variant             --fitness-column fitness             --out .phase2a4_data/GB1.csv

          python experiments/v8_3_multilandscape_validation/prepare_four_site.py             .phase2a4_data/trpb_raw.csv             --variant-column variant             --fitness-column fitness             --out .phase2a4_data/TRPB.csv

          python experiments/v8_3_multilandscape_validation/prepare_four_site.py             .phase2a4_data/phoq_raw.csv             --variant-column Variants             --fitness-column Fitness             --out .phase2a4_data/PHOQ.csv

      - name: Run multilandscape acquisition evaluation
        run: |
          python             phase2/2A_closed_loop_acquisition/2A4_multilandscape_evaluation/run_multilandscape_evaluation.py             --landscape GB1=.phase2a4_data/GB1.csv             --landscape TRPB=.phase2a4_data/TRPB.csv             --landscape PHOQ=.phase2a4_data/PHOQ.csv             --out .ci_artifacts/phase2_2a4_multilandscape

      - name: Upload multilandscape artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nabu-phase2-2a4-multilandscape
          path: .ci_artifacts/phase2_2a4_multilandscape
