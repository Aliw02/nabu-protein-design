name: NABU Phase 2A0 Campaign Simulator

on:
  pull_request:
    branches:
      - engineering/v8-3-package-hardening
    paths:
      - "phase2/2A_closed_loop_acquisition/2A0_campaign_simulator/**"
      - ".github/workflows/phase2-2a0-campaign-simulator.yml"
      - "src/nabu_protein/**"
      - "requirements-hardening.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-2a0:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned hardening environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-hardening.txt
          python -m pip install -e . --no-deps

      - name: Run Phase 2A0 tests
        run: |
          python -m pytest -q             phase2/2A_closed_loop_acquisition/2A0_campaign_simulator/tests

      - name: Run RhlA engineering smoke
        run: |
          python             phase2/2A_closed_loop_acquisition/2A0_campaign_simulator/run_rhla_smoke.py             --rounds 3             --batch-size 16             --out .ci_artifacts/phase2_2a0_rhla_smoke

      - name: Upload engineering smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nabu-phase2-2a0-rhla-smoke
          path: .ci_artifacts/phase2_2a0_rhla_smoke
