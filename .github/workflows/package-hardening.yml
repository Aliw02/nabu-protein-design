name: NABU Package Hardening

on:
  push:
    branches:
      - engineering/v8-3-package-hardening
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned hardening environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-hardening.txt
          python -m pip install -e . --no-deps

      - name: Run deterministic package tests
        run: python -m pytest -q tests
