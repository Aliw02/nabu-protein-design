name: NABU Package Hardening

on:
  push:
    branches:
      - engineering/v8-3-package-hardening
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run deterministic package parity tests
        run: python -m pytest -q tests/test_frozen_v83_parity.py
