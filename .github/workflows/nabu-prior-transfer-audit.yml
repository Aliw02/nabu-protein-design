name: NABU External Higher-Order Prior Transfer

on:
  push:
    branches:
      - exp/nabu-root-cause-audit
    paths:
      - "experiments/root_cause_prior_transfer/**"
      - ".github/workflows/nabu-prior-transfer-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  prior-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-hardening.txt
          python -m pip install -r phase2/2D_untouched_transfer/requirements-phase2d.txt
          python -m pip install -e . --no-deps

      - name: Smoke test
        run: |
          python experiments/root_cause_prior_transfer/run_prior_transfer.py --help

      - name: Download pinned revealed development sources only
        run: |
          mkdir -p .source
          python - <<'PY'
          from pathlib import Path
          from urllib.request import urlretrieve

          urlretrieve(
              "https://zenodo.org/records/18433203/files/trpb/two_to_many.csv.gz?download=1",
              Path(".source/trpb_two_to_many.csv.gz"),
          )
          urlretrieve(
              "https://raw.githubusercontent.com/rcronk/mutate/0861a3f1f6c58a9597fde689eb7f9a07b38e2638/ridge/data/gb1_wu2016_landscape.csv",
              Path(".source/gb1_wu2016_landscape.csv"),
          )
          PY
          echo "a611408d2db06907a023ddc8a1d94c12  .source/trpb_two_to_many.csv.gz" | md5sum -c -

      - name: Verify GB1 source and NucB absence
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          p = Path(".source/gb1_wu2016_landscape.csv")
          data = p.read_bytes()
          blob = hashlib.sha1(f"blob {len(data)}\0".encode() + data).hexdigest()
          if len(data) != 2993024:
              raise SystemExit("GB1 size drift")
          if blob != "a1e9f5146a9441210eaf88accfa660f02d80cbb7":
              raise SystemExit("GB1 blob drift")
          PY
          if find .source -iname '*nucb*' | grep -q .; then
            echo "NucB unexpectedly present."
            exit 1
          fi
          echo "Sources verified; NucB absent."

      - name: Run preregistered cross-landscape prior transfer
        run: |
          python experiments/root_cause_prior_transfer/run_prior_transfer.py             --trpb .source/trpb_two_to_many.csv.gz             --gb1 .source/gb1_wu2016_landscape.csv             --out result

      - name: Print decision
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path("result/PRIOR_TRANSFER_MATRIX.json").read_text())
          print(json.dumps(m, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: nabu-external-higher-order-prior-transfer
          path: result/
