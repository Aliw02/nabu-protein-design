name: NABU B2 Residual Context NucB Untouched Blind

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  TOKENIZERS_PARALLELISM: "false"
  HF_HUB_DISABLE_TELEMETRY: "1"

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install base stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-hardening.txt
          python -m pip install -r phase2/2D_untouched_transfer/requirements-phase2d.txt
          python -m pip install -e . --no-deps
      - name: Smoke test blind entrypoints
        run: |
          python experiments/nucb_blind/prepare.py --help
          python experiments/b2_residual_context_dev/train.py --help
          python experiments/b2_residual_context_dev/predict_shard.py --help
          python experiments/b2_residual_context_dev/aggregate.py --help
          python experiments/nucb_blind/evaluate.py --help
      - name: Download pinned untouched NucB source
        run: |
          mkdir -p .source
          python - <<'PY'
          from pathlib import Path
          from urllib.request import urlretrieve
          url = "https://zenodo.org/records/18433203/files/nucb/two_to_many.csv.gz?download=1"
          path = Path(".source/two_to_many.csv.gz")
          urlretrieve(url, path)
          PY
          echo "cdedaadd57f2b148950b357e9f24c238  .source/two_to_many.csv.gz" | md5sum -c -
      - name: Seal NucB test targets
        run: |
          python experiments/nucb_blind/prepare.py             .source/two_to_many.csv.gz             --out prepared
      - uses: actions/upload-artifact@v4
        with:
          name: nucb-prediction-visible
          path: |
            prepared/fit.csv.gz
            prepared/test_masked.csv.gz
            prepared/SOURCE_MANIFEST.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: nucb-reveal-sealed
          path: prepared/test_reveal.csv.gz
          if-no-files-found: error

  train:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frozen stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-hardening.txt
          python -m pip install -r phase2/2D_untouched_transfer/requirements-phase2d.txt
          python -m pip install -e . --no-deps
          python -m pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==5.17.0 safetensors joblib
      - uses: actions/download-artifact@v4
        with:
          name: nucb-prediction-visible
          path: data
      - name: Fit frozen B2-residual Context
        run: |
          python experiments/b2_residual_context_dev/train.py             data/fit.csv.gz             --source-manifest data/SOURCE_MANIFEST.json             --out trained             --batch-size 32
      - uses: actions/upload-artifact@v4
        with:
          name: nucb-frozen-state
          path: trained/
          if-no-files-found: error

  predict:
    needs: train
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install prediction stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-hardening.txt
          python -m pip install -r phase2/2D_untouched_transfer/requirements-phase2d.txt
          python -m pip install -e . --no-deps
          python -m pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==5.17.0 safetensors joblib
      - uses: actions/download-artifact@v4
        with:
          name: nucb-prediction-visible
          path: data
      - uses: actions/download-artifact@v4
        with:
          name: nucb-frozen-state
          path: state
      - name: Predict masked shard ${{ matrix.shard }}
        run: |
          python experiments/b2_residual_context_dev/predict_shard.py             data/test_masked.csv.gz             --state state/B2_RESIDUAL_CONTEXT_STATE.joblib             --shard-index ${{ matrix.shard }}             --shard-count 8             --batch-size 32             --out shard
      - uses: actions/upload-artifact@v4
        with:
          name: nucb-shard-${{ matrix.shard }}
          path: shard/
          if-no-files-found: error

  freeze:
    needs: predict
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install aggregation stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas
      - uses: actions/download-artifact@v4
        with:
          name: nucb-prediction-visible
          path: data
      - uses: actions/download-artifact@v4
        with:
          pattern: nucb-shard-*
          path: shards
          merge-multiple: true
      - name: Freeze predictions before reveal
        run: |
          python experiments/b2_residual_context_dev/aggregate.py             shards             --source-manifest data/SOURCE_MANIFEST.json             --out frozen
          python experiments/b2_residual_context_dev/aggregate.py             shards             --source-manifest data/SOURCE_MANIFEST.json             --out replay
      - uses: actions/upload-artifact@v4
        with:
          name: nucb-frozen-predictions
          path: |
            frozen/FROZEN_PREDICTIONS.csv.gz
            frozen/FREEZE_MANIFEST.json
            replay/FREEZE_MANIFEST.json
          if-no-files-found: error

  reveal:
    needs: freeze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install evaluation stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-hardening.txt
          python -m pip install -r phase2/2D_untouched_transfer/requirements-phase2d.txt
          python -m pip install -e . --no-deps
      - uses: actions/download-artifact@v4
        with:
          name: nucb-prediction-visible
          path: data
      - uses: actions/download-artifact@v4
        with:
          name: nucb-frozen-state
          path: state
      - uses: actions/download-artifact@v4
        with:
          name: nucb-frozen-predictions
          path: frozen_bundle
      - name: Reveal targets only after freeze
        uses: actions/download-artifact@v4
        with:
          name: nucb-reveal-sealed
          path: reveal
      - name: Evaluate untouched NucB blind
        run: |
          python experiments/nucb_blind/evaluate.py             frozen_bundle/FROZEN_PREDICTIONS.csv.gz             reveal/test_reveal.csv.gz             --freeze-manifest frozen_bundle/FREEZE_MANIFEST.json             --replay-freeze-manifest frozen_bundle/FREEZE_MANIFEST.json             --source-manifest data/SOURCE_MANIFEST.json             --train-diagnostics state/TRAIN_DIAGNOSTICS.json             --out result
      - uses: actions/upload-artifact@v4
        with:
          name: nabu-nucb-untouched-blind-result
          path: result/
          if-no-files-found: error
