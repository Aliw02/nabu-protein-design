name: NABU V8.3 Multilandscape Historical Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-v8-3:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install historical validation dependencies
        run: python -m pip install -r requirements-hardening.txt

      - name: Download pinned GB1, TrpB and PhoQ sources
        run: |
          mkdir -p .validation_data .ci_artifacts/nabu_v8_3_multilandscape_results
          curl -L --fail \
            "https://raw.githubusercontent.com/rcronk/mutate/0861a3f1f6c58a9597fde689eb7f9a07b38e2638/ridge/data/gb1_wu2016_landscape.csv" \
            -o .validation_data/gb1_raw.csv
          curl -L --fail \
            "https://raw.githubusercontent.com/rcronk/mutate/0861a3f1f6c58a9597fde689eb7f9a07b38e2638/ridge/data/johnston2024_trpb_landscape.csv" \
            -o .validation_data/trpb_raw.csv
          curl -L --fail \
            "https://raw.githubusercontent.com/hury07/fasthit/0f9c51aa7caaab0b4618b0cab4f3107e7251091b/fasthit/landscapes/data/phoq/PhoQ.csv" \
            -o .validation_data/phoq_raw.csv

      - name: Adapt datasets
        run: |
          python experiments/v8_3_multilandscape_validation/prepare_four_site.py \
            .validation_data/gb1_raw.csv \
            --variant-column variant \
            --fitness-column fitness \
            --out .validation_data/GB1_Wu2016_V83.csv

          python experiments/v8_3_multilandscape_validation/prepare_four_site.py \
            .validation_data/trpb_raw.csv \
            --variant-column variant \
            --fitness-column fitness \
            --out .validation_data/TRPB_Johnston2024_V83.csv

          python experiments/v8_3_multilandscape_validation/prepare_four_site.py \
            .validation_data/phoq_raw.csv \
            --variant-column Variants \
            --fitness-column Fitness \
            --out .validation_data/PHOQ_V83.csv

      - name: Run frozen V8.3 validation
        run: |
          python experiments/v8_3_multilandscape_validation/run_v8_3_validation.py \
            .validation_data/GB1_Wu2016_V83.csv \
            --out .ci_artifacts/nabu_v8_3_multilandscape_results/GB1_V8_3_RESULTS.json

          python experiments/v8_3_multilandscape_validation/run_v8_3_validation.py \
            .validation_data/TRPB_Johnston2024_V83.csv \
            --out .ci_artifacts/nabu_v8_3_multilandscape_results/TRPB_V8_3_RESULTS.json

          python experiments/v8_3_multilandscape_validation/run_v8_3_validation.py \
            .validation_data/PHOQ_V83.csv \
            --out .ci_artifacts/nabu_v8_3_multilandscape_results/PHOQ_V8_3_RESULTS.json

      - name: Upload ephemeral validation output
        uses: actions/upload-artifact@v4
        with:
          name: nabu-v8-3-multilandscape-historical-validation
          path: .ci_artifacts/nabu_v8_3_multilandscape_results
