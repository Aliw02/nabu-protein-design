name: NABU Root Cause Audit

on:
  push:
    branches:
      - exp/nabu-root-cause-audit
    paths:
      - "experiments/root_cause_audit/**"
      - ".github/workflows/nabu-root-cause-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-hardening.txt
          python -m pip install -r phase2/2D_untouched_transfer/requirements-phase2d.txt
          python -m pip install -e . --no-deps

      - name: Smoke test audit entrypoint
        run: |
          python experiments/root_cause_audit/run_root_cause_audit.py --help

      - name: Download pinned TrpB only
        run: |
          mkdir -p .source
          python - <<'PY'
          from pathlib import Path
          from urllib.request import urlretrieve

          url = "https://zenodo.org/records/18433203/files/trpb/two_to_many.csv.gz?download=1"
          path = Path(".source/two_to_many.csv.gz")
          urlretrieve(url, path)
          PY
          echo "a611408d2db06907a023ddc8a1d94c12  .source/two_to_many.csv.gz" | md5sum -c -

      - name: Recreate canonical revealed TrpB development split
        run: |
          python experiments/v9_trpb_blind/prepare_trpb_blind.py             .source/two_to_many.csv.gz             --out prepared

      - name: Run preregistered root-cause audit
        run: |
          python experiments/root_cause_audit/run_root_cause_audit.py             prepared/fit.csv.gz             prepared/test_masked.csv.gz             prepared/test_reveal.csv.gz             --source-manifest prepared/SOURCE_MANIFEST.json             --out result

      - name: Print decision summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("result/ROOT_CAUSE_REPORT.json").read_text())
          print(json.dumps({
              "primary_cause": report["decision"]["primary_cause"],
              "triggered_causes": report["decision"]["triggered_causes"],
              "coverage": report["coverage"],
              "o3_minus_o2_spearman_same_supported_quads": report["decision"]["o3_minus_o2_spearman_same_supported_quads"],
              "pair_identity_spearman_gain_over_shuffle": report["decision"]["pair_identity_spearman_gain_over_shuffle"],
              "max_abs_error_alignment_spearman": report["decision"]["max_abs_error_alignment_spearman"],
              "nucb_consumed": report["nucb_consumed"],
              "phase3_opened": report["phase3_opened"],
          }, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: nabu-root-cause-audit-result
          path: result/
