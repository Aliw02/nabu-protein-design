name: NABU V8.3 Adaptive Router Historical Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-v8-3:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install historical validation dependencies
        run: python -m pip install -r requirements-hardening.txt

      - name: Run historical V8.3 router validation
        run: |
          python experiments/v8_3_adaptive_router/run_v8_3_router.py \
            --root nabu_v8_2_tournament_results \
            --out .ci_artifacts/nabu_v8_3_router_results

      - name: Upload ephemeral validation output
        uses: actions/upload-artifact@v4
        with:
          name: nabu-v8-3-router-historical-validation
          path: .ci_artifacts/nabu_v8_3_router_results
