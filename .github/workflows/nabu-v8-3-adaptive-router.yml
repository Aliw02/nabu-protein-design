name: NABU V8.3 Adaptive Router

on:
  push:
    branches:
      - exp/nabu-v8-3-adaptive-router
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-v8-3:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy scipy

      - name: Run V8.3
        run: |
          python experiments/v8_3_adaptive_router/run_v8_3_router.py \
            --root nabu_v8_2_tournament_results \
            --out nabu_v8_3_router_results

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nabu_v8_3_router_results
          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "results: add NABU V8.3 adaptive router outputs [skip ci]"
            git push
          fi
