name: NABU Root Cause Falsification Stage 1

on:
  push:
    branches:
      - exp/nabu-root-cause-audit
    paths:
      - "experiments/root_cause_falsification/**"
      - ".github/workflows/nabu-root-cause-falsification.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  falsification:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-hardening.txt
          python -m pip install -r phase2/2D_untouched_transfer/requirements-phase2d.txt
          python -m pip install -e . --no-deps

      - name: Smoke test
        run: |
          python experiments/root_cause_falsification/run_falsification.py --help

      - name: Download pinned revealed development sources only
        run: |
          mkdir -p .source

          python - <<'PY'
          from pathlib import Path
          from urllib.request import urlretrieve

          urlretrieve(
              "https://zenodo.org/records/18433203/files/trpb/two_to_many.csv.gz?download=1",
              Path(".source/trpb_two_to_many.csv.gz"),
          )
          urlretrieve(
              "https://flip.protein.properties/assets/splits/ired/two_to_many.csv.gz",
              Path(".source/ired_two_to_many.csv.gz"),
          )
          PY

          echo "a611408d2db06907a023ddc8a1d94c12  .source/trpb_two_to_many.csv.gz" | md5sum -c -
          echo "aa45a2f85fb1af87b6b0e86397b3f8f292a061dc574be2536673b5bd490b0e74  .source/ired_two_to_many.csv.gz" | sha256sum -c -

      - name: Prove NucB is absent
        run: |
          if find .source -iname '*nucb*' | grep -q .; then
            echo "NucB unexpectedly present."
            exit 1
          fi
          echo "NucB absent."

      - name: Run preregistered falsification stage 1
        run: |
          python experiments/root_cause_falsification/run_falsification.py             --trpb .source/trpb_two_to_many.csv.gz             --ired .source/ired_two_to_many.csv.gz             --out result

      - name: Print compact matrix
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          matrix = json.loads(Path("result/FALSIFICATION_MATRIX.json").read_text())
          print("ROOT:", matrix["root_cause_status"])
          for name, item in matrix["hypotheses"].items():
              print(f"{name}: {item['status']}")
          print("NucB consumed:", matrix["nucb_consumed"])
          print("Phase 3 opened:", matrix["phase3_opened"])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: nabu-root-cause-falsification-stage1
          path: result/
