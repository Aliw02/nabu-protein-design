name: NABU Clean Pair Unseen-Edge POC

on:
  push:
    branches:
      - exp/nabu-v9-pair-transfer-dev
    paths:
      - "experiments/v9_pair_transfer_dev/clean_pair_poc/**"
      - ".github/workflows/nabu-clean-pair-poc.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-pair-poc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install exact dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-hardening.txt
          python -m pip install -r phase2/2D_untouched_transfer/requirements-phase2d.txt
          python -m pip install -e . --no-deps

      - name: Run clean-pair contracts
        run: |
          python -m pytest -q             experiments/v9_pair_transfer_dev/clean_pair_poc/tests/test_clean_pair_poc.py             tests/test_v83_contracts.py             tests/test_frozen_v83_parity.py

      - name: Download pinned IRED source
        run: |
          mkdir -p .clean_pair_source
          python - <<'PY'
          from pathlib import Path
          from urllib.request import urlretrieve

          url = "https://flip.protein.properties/assets/splits/ired/two_to_many.csv.gz"
          path = Path(".clean_pair_source/ired_two_to_many.csv.gz")
          urlretrieve(url, path)
          print(path)
          PY
          echo "aa45a2f85fb1af87b6b0e86397b3f8f292a061dc574be2536673b5bd490b0e74  .clean_pair_source/ired_two_to_many.csv.gz" | sha256sum -c -

      - name: Run clean-pair unseen-edge diagnostic
        run: |
          python experiments/v9_pair_transfer_dev/clean_pair_poc/run_clean_pair_poc.py             .clean_pair_source/ired_two_to_many.csv.gz             --out clean_pair_poc_results

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: nabu-clean-pair-unseen-edge-poc
          path: clean_pair_poc_results/
          if-no-files-found: error
