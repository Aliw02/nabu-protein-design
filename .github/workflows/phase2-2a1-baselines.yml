name: NABU Phase 2A1 Baselines

on:
  pull_request:
    branches:
      - engineering/v8-3-package-hardening
    paths:
      - "phase2/2A_closed_loop_acquisition/2A0_campaign_simulator/**"
      - "phase2/2A_closed_loop_acquisition/2A1_baselines/**"
      - ".github/workflows/phase2-2a1-baselines.yml"
      - "src/nabu_protein/**"
      - "requirements-hardening.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-2a1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned hardening environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-hardening.txt
          python -m pip install -e . --no-deps

      - name: Run 2A0 and 2A1 tests
        run: |
          python -m pytest -q             phase2/2A_closed_loop_acquisition/2A0_campaign_simulator/tests             phase2/2A_closed_loop_acquisition/2A1_baselines/tests

      - name: Run RhlA baseline tournament
        run: |
          python             phase2/2A_closed_loop_acquisition/2A1_baselines/run_baseline_tournament.py             --target-fraction 0.20             --batch-size 16             --out .ci_artifacts/phase2_2a1_rhla_baselines

      - name: Upload baseline tournament artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nabu-phase2-2a1-rhla-baselines
          path: .ci_artifacts/phase2_2a1_rhla_baselines
