name: NABU Phase 2D IRED Blind Transfer V2

on:
  push:
    branches:
      - phase2/roadmap-scaffold
    paths:
      - ".github/workflows/phase2-2d-ired-blind-v2.yml"
  workflow_dispatch:

concurrency:
  group: phase2d-ired-blind-v2
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ired-blind-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout frozen Phase-2 branch
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install frozen environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-hardening.txt
          python -m pip install -r phase2/2D_untouched_transfer/requirements-phase2d.txt
          python -m pip install -e . --no-deps

      - name: Run Phase 2D contracts
        run: |
          python -m pytest -q phase2/2D_untouched_transfer/tests

      - name: Download pinned IRED source
        run: |
          mkdir -p .phase2d_blind_source .ci_artifacts/phase2d_ired_blind_v2
          curl -L --fail --retry 3 \
            "https://flip.protein.properties/assets/splits/ired/two_to_many.csv.gz" \
            -o .phase2d_blind_source/ired_two_to_many.csv.gz
          echo "aa45a2f85fb1af87b6b0e86397b3f8f292a061dc574be2536673b5bd490b0e74  .phase2d_blind_source/ired_two_to_many.csv.gz" | sha256sum -c -

      - name: Verify frozen identity-only scoreability contract
        run: |
          python phase2/2D_untouched_transfer/ired_scoreability_preflight.py \
            --ired-gz .phase2d_blind_source/ired_two_to_many.csv.gz \
            --out .ci_artifacts/phase2d_ired_blind_v2/IRED_SCOREABILITY_PREFLIGHT.json
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path(
              ".ci_artifacts/phase2d_ired_blind_v2/IRED_SCOREABILITY_PREFLIGHT.json"
          ).read_text())
          expected = {
              "fit_count": 3746,
              "validation_count": 662,
              "test_count": 4178,
              "scoreable_count": 131,
              "unscoreable_count": 4047,
          }
          for key, value in expected.items():
              if int(r[key]) != value:
                  raise SystemExit(
                      f"Identity drift: {key} expected {value}, got {r[key]}"
                  )
          if r["target_values_read"]:
              raise SystemExit("Identity gate unexpectedly read targets.")
          print("Frozen IRED identity contract verified.")
          PY

      - name: Reveal targets and run untouched full-test evaluation
        run: |
          python phase2/2D_untouched_transfer/run_ired_blind_v2.py \
            .phase2d_blind_source/ired_two_to_many.csv.gz \
            --out .ci_artifacts/phase2d_ired_blind_v2

      - name: Preserve source checksum and execution head
        if: always()
        run: |
          mkdir -p .ci_artifacts/phase2d_ired_blind_v2
          sha256sum .phase2d_blind_source/ired_two_to_many.csv.gz \
            > .ci_artifacts/phase2d_ired_blind_v2/SOURCE_SHA256.txt || true
          git rev-parse HEAD \
            > .ci_artifacts/phase2d_ired_blind_v2/EXECUTION_HEAD.txt

      - name: Upload immutable blind evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nabu-phase2d-ired-blind-v2
          path: .ci_artifacts/phase2d_ired_blind_v2
